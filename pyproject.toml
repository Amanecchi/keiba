[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-acquisition"
version = "0.5.2"
description = "JRA official data acquisition and owner-only historical analysis web application"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4==4.14.2", "requests==2.32.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]
web = ["Flask==3.1.3", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.8", "gunicorn==26.2.0"]

[project.scripts]
jra-collect = "keiba_acquisition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keiba_acquisition = ["data/*.json"]
keiba_web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
