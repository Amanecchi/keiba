[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-acquisition"
version = "0.4.0"
description = "JRA official data acquisition and historical feature feasibility probe"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4==4.14.2", "requests==2.32.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[project.scripts]
jra-collect = "keiba_acquisition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
