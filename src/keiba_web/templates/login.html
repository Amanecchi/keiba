<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ログイン · 競馬の記録</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <p class="eyebrow">競馬の記録 / PERSONAL</p>
      <h1>過去の結果から、<br />傾向を読む。</h1>
      <p class="muted">ご本人用の分析画面へログインします。</p>
      {% if error %}
      <p role="alert" class="notice error">{{ error }}</p>
      {% endif %}
      <form method="post">
        <input type="hidden" name="csrf" value="{{ session.csrf }}" /><label
          >ログイン名<input
            name="name"
            autocomplete="username"
            required
            maxlength="100" /></label
        ><label
          >パスワード<input
            type="password"
            name="password"
            autocomplete="current-password"
            required
            maxlength="256" /></label
        ><button type="submit" class="primary">ログイン</button>
      </form>
    </main>
  </body>
</html>
