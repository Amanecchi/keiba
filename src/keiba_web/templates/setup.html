<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>本人用ログインの初期設定 · 競馬の記録</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <p class="eyebrow">PRIVATE WORKSPACE</p>
      <h1>ログインの初期設定</h1>
      <p class="muted">ご本人用のパスワードを一度だけ設定します。</p>
      {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf" value="{{ session.csrf }}" />
        <label>初期設定コード
          <input type="password" name="setup_token" required autocomplete="off" />
        </label>
        <p class="hint">配備先の管理画面で発行された本人用コードを入力してください。</p>
        <label>新しいパスワード
          <input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password" />
        </label>
        <label>パスワード（確認）
          <input type="password" name="confirmation" required minlength="12" maxlength="128" autocomplete="new-password" />
        </label>
        <button class="primary wide">設定して利用を開始</button>
      </form>
    </main>
  </body>
</html>
